name: Deploy song bank
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: site/data/psalmnote.json
          key: psalmnote-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: psalmnote-v1-
      - name: Refresh spreadsheet snapshot
        run: node scripts/refresh-sheet.mjs
        continue-on-error: true
      - name: Look up Psalmnote song types
        run: |
          npm install --no-save --package-lock=false cheerio@1.1.2 robots-parser@3.0.1
          node scripts/refresh-psalmnote.mjs
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
